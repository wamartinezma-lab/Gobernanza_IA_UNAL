<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roadmap de exposición (30 min) · Gobernanza de la IA en la UNAL</title>
<style>
  :root{
    --verde:#1f4037;--verde-prof:#132a24;--dorado:#b89347;--naranja:#e8933f;
    --crema:#f4f1e9;--txt:#eaf0ed;--txt2:#9fb0a8;--card:#1c352d;--borde:#2c4a40;
    --azul:#2962ff;--teal:#0f8c82;--control:#e8591c;--socio:#17a06a;--cned:#1b355b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--verde-prof);color:var(--txt);height:100vh;overflow:hidden;}

  .wrap{display:flex;flex-direction:column;height:100vh;}

  /* Barra superior: progreso + reloj */
  header{display:flex;align-items:center;gap:16px;padding:12px 22px;background:linear-gradient(90deg,#0f2620,#1f4037);border-bottom:3px solid var(--dorado);}
  header .crest{width:38px;height:38px;border:1.5px solid var(--dorado);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--dorado);font-size:10px;flex:0 0 auto;}
  header .ttl{font-size:14px;font-weight:700;line-height:1.2;}
  header .ttl span{color:var(--dorado);font-weight:400;font-size:11.5px;display:block;}
  header .clock{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .timebox{text-align:right;}
  .timebox .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
  .timebox .lbl{font-size:10px;color:var(--txt2);letter-spacing:1px;text-transform:uppercase;}
  .timebox.over .big{color:#ff7a6b;}
  header button{background:var(--dorado);color:var(--verde-prof);border:none;border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;}
  header button.sec{background:transparent;color:var(--txt);border:1px solid var(--borde);}
  header button:hover{opacity:.9;}

  /* Barra de progreso de bloques */
  .track{display:flex;gap:3px;padding:8px 22px;background:#0f2620;}
  .track .seg{flex:var(--w,1);height:7px;border-radius:4px;background:#2c4a40;position:relative;overflow:hidden;cursor:pointer;transition:.2s;}
  .track .seg .fill{position:absolute;inset:0;width:0;background:var(--dorado);transition:width .3s linear;}
  .track .seg.done .fill{width:100%;}
  .track .seg.active{box-shadow:0 0 0 2px var(--dorado);}

  /* Cuerpo: slide actual */
  main{flex:1;display:flex;gap:0;min-height:0;}
  .slide{flex:1;padding:26px 40px;overflow-y:auto;display:none;animation:fade .3s;}
  .slide.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .slide .num{font-size:12px;letter-spacing:2px;color:var(--dorado);text-transform:uppercase;}
  .slide h2{font-size:30px;margin:4px 0 6px;line-height:1.15;}
  .slide .mins{display:inline-block;font-size:12px;background:var(--card);border:1px solid var(--borde);border-radius:20px;padding:3px 12px;color:var(--dorado);margin-bottom:16px;}
  .slide .key{font-size:16px;background:var(--card);border-left:5px solid var(--dorado);border-radius:0 10px 10px 0;padding:13px 16px;margin-bottom:18px;line-height:1.5;}
  .slide .key b{color:var(--dorado);}
  .slide ul{list-style:none;margin:0 0 16px;}
  .slide li{font-size:14.5px;line-height:1.6;padding-left:22px;position:relative;margin-bottom:8px;}
  .slide li::before{content:"▸";position:absolute;left:0;color:var(--dorado);}
  .slide .screen{display:flex;align-items:flex-start;gap:10px;background:rgba(184,147,71,.1);border:1px dashed var(--dorado);border-radius:10px;padding:12px 15px;margin-top:8px;font-size:13.5px;line-height:1.5;}
  .slide .screen .ic{font-size:18px;}
  .slide .say{font-size:13px;color:var(--txt2);font-style:italic;margin-top:14px;border-left:3px solid var(--borde);padding-left:12px;line-height:1.5;}
  .slide .demo{counter-reset:d;list-style:none;}
  .slide .demo li{padding-left:34px;}
  .slide .demo li::before{counter-increment:d;content:counter(d);background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;left:0;top:1px;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .refcard{background:var(--card);border-radius:10px;border-top:4px solid var(--dorado);padding:12px 14px;}
  .refcard h4{font-size:14px;margin-bottom:4px;}
  .refcard p{font-size:12.5px;color:var(--txt2);line-height:1.5;}
  .chk{list-style:none;} .chk li{padding-left:26px;} .chk li::before{content:"☐";color:var(--dorado);font-size:16px;}

  footer{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:#0f2620;border-top:1px solid var(--borde);font-size:12px;color:var(--txt2);}
  footer .nav{display:flex;gap:8px;}
  footer button{background:var(--card);border:1px solid var(--borde);color:var(--txt);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;}
  footer button:hover{border-color:var(--dorado);}
  kbd{background:var(--card);border:1px solid var(--borde);border-radius:5px;padding:1px 6px;font-size:11px;}

  @media(max-width:720px){.slide{padding:18px 18px;}.slide h2{font-size:22px;}.cols{grid-template-columns:1fr;}header .ttl span{display:none;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crest">UNAL</div>
    <div class="ttl">Roadmap de exposición — Gobernanza de la IA en la UNAL<span>Guion de 30 minutos · DNED–DIVULAB · modo presentador</span></div>
    <div class="clock">
      <div class="timebox" id="segBox"><div class="big" id="segTime">0:00</div><div class="lbl">bloque actual</div></div>
      <div class="timebox" id="totBox"><div class="big" id="totTime">30:00</div><div class="lbl">total restante</div></div>
      <button id="btnStart">▶ Iniciar</button>
      <button class="sec" id="btnReset">↺</button>
    </div>
  </header>

  <div class="track" id="track"></div>

  <main id="main"></main>

  <footer>
    <div>Bloque <b id="pos">1</b> / <span id="count">9</span> · <span id="blkName"></span></div>
    <div class="nav">
      <button id="prev">← Anterior</button>
      <button id="next">Siguiente →</button>
    </div>
    <div>Teclas: <kbd>←</kbd> <kbd>→</kbd> navegar · <kbd>Espacio</kbd> iniciar/pausar</div>
  </footer>
</div>

<script>
/* ====== Contenido de los bloques ====== */
const BLOCKS=[
  {n:'Bloque 0', mins:2, title:'Apertura y gancho',
   key:'La IA ya está en aulas, investigación y gestión. La pregunta no es <b>si</b> usarla, sino <b>quién decide qué</b>, con qué datos y con qué límites.',
   items:[
     'Presentación: DNED–DIVULAB y propósito de la charla.',
     'Gancho: «Un predictor de deserción suena inofensivo… pero decide sobre el futuro de personas. ¿Quién lo autoriza? ¿Quién lo frena?»',
     'Promesa: en 30 min verán el modelo completo y una simulación en vivo.'
   ],
   screen:'Portada / título.',
   say:'No entrar en tecnicismos aún; crear expectativa.'},

  {n:'Bloque 1', mins:3, title:'El problema: por qué gobernar la IA',
   key:'La gobernanza de la IA <b>supera al gobierno de TI</b>: es un asunto institucional de derechos, misión y sostenibilidad.',
   items:[
     'Riesgos: caja negra, sesgos, fuga de información, pérdida de supervisión humana, huella de carbono.',
     'Gobernanza de IA ⊂ gobierno corporativo, con intersección a gobierno de TI y de datos (Rec. 3).',
     'Abarca las 3 misiones + dimensión ética y ambiental.'
   ],
   screen:'Dashboard › Gestión de riesgo › tarjeta «Gobernanza corporativa de la IA».'},

  {n:'Bloque 2', mins:4, title:'Qué hacen otras universidades (benchmarking)',
   key:'Tres modelos de referencia, pero la UNAL debe mirar también al <b>Sur Global</b>.',
   items:[
     'MIT — descentralizado (SERC, programa semilla).',
     'UCLA — matricial-centralizado (UC AI Council, veto clínico HIPAA).',
     'Stanford — hub-and-spoke (HAI, AI Index, huella de carbono).',
     'Sur Global (Rec. 1): Tec de Monterrey, USP, UNAM e INTEGRITY-AI (U. del Cauca, U. San Buenaventura).'
   ],
   screen:'GEMELO 3D → botón «🛰 Modelos de referencia». Rotar la escena (dos órbitas: Norte y Sur Global).',
   say:'Transición: «Ninguno encaja tal cual; la UNAL es pública, nacional, pluriétnica y multicampus.»'},

  {n:'Bloque 3', mins:5, title:'El modelo UNAL: multinivel y 4 núcleos',
   key:'Modelo <b>multinivel, participativo y multicampus</b>, guiado por las misiones.',
   items:[
     'Tres niveles: CNED (política) → Mesa Técnica de IA (ejecución) → Comunidad (9 sedes, facultades, grupos).',
     '4 núcleos: 1.1 Estratégico Misional · 1.2 Técnico & Green · 1.3 Control & Jurídico-Fiscal · 1.4 Socio-Ambiental & Territorial.',
     'Subsidiariedad (Rec. 9): decidir en el nivel más cercano al riesgo y al valor.',
     'Capacidades habilitantes y legitimidad (Rec. 10): gobernanza ≠ operación.'
   ],
   screen:'GEMELO 3D (vista orbital; clic en la Mesa y en un núcleo) → Dashboard › Estructura (arquitectura de decisiones).'},

  {n:'Bloque 4', mins:5, title:'Cómo opera la Mesa: plenaria, quórum y votación',
   key:'La Mesa opera como <b>órgano colegiado</b>: una Plenaria de Delegados (uno por núcleo) analiza, traslada a trámite y decide por quórum.',
   items:[
     'Flujo: radicación en plenaria → traslado a trámite a los 4 núcleos → regreso con ponencia → deliberación → dictamen colegiado.',
     'Interacción 1.2 ↔ 1.3: técnico y jurídico se consultan (datos/licencias ↔ seguridad/infra).',
     'Quórum (≥ 3 de 4) y votación: a favor / con salvaguardas / objeción.',
     'Regla: una objeción de 1.3 o 1.4 por riesgo a derechos prevalece (veto / escalar al CNED).'
   ],
   screen:'Dashboard › Simulador › mini-diagrama animado (▶ Reproducir); pasar el mouse por la flecha 1.2↔1.3.'},

  {n:'Bloque 5', mins:4, title:'Riesgo, taxonomía y matriz RACI',
   key:'No todas las «iniciativas de IA» son iguales: se gobiernan <b>por tipo y por riesgo a derechos</b>.',
   items:[
     'Taxonomía (Rec. 5): administrativo, aula, investigación, propio, generativo de terceros, agéntico.',
     'Niveles de riesgo (Rec. 6): bajo / medio / alto / inaceptable.',
     'Veto por derechos (Rec. 4): deserción o becas pueden lesionar derechos tanto como un sistema clínico.',
     'Matriz RACI (Rec. 8): quién propone, evalúa, autoriza, implementa, supervisa y suspende.'
   ],
   screen:'Dashboard › Gestión de riesgo (niveles + taxonomía) y › Roles (RACI).'},

  {n:'Bloque 6', mins:4, title:'Demo en vivo del simulador', demo:true,
   key:'Veamos el modelo <b>funcionando</b> con un caso real.',
   items:[
     'Ir a Dashboard › Simulador.',
     'Elegir el escenario «Deserción estudiantil».',
     'Señalar el riesgo calculado: Alto.',
     'Dejar correr la animación: Facultad → Sede → Plenaria → trámite en 4 núcleos → votación.',
     'Resaltar: 1.3 Jurídico objeta por datos sensibles → objeción prevalente → escala al CNED.',
     'Mostrar el veredicto final (🔵 Escalada al CNED).'
   ],
   screen:'Dashboard › Simulador. Plan B: capturas de pantalla de las etapas si falla la proyección.',
   say:'Si hay tiempo, correr un caso de bajo riesgo (tutor en aula) para contrastar: se queda en la facultad.'},

  {n:'Bloque 7', mins:2, title:'Recomendaciones y hoja de ruta 2025–2027',
   key:'El modelo recoge <b>revisión académica</b> y tiene un plan de implementación.',
   items:[
     'Las 10 recomendaciones de la Prof. Sánchez Torres ya están incorporadas.',
     'Plan 2025–2027: Diagnóstico → Co-construcción → Validación → Revisión/aprobación → Implementación.'
   ],
   screen:'Dashboard › Recomendaciones y › Procesos y ciclo (línea de tiempo).'},

  {n:'Bloque 8', mins:1, title:'Cierre + preguntas',
   key:'«La gobernanza de la IA en la UNAL es un mecanismo de <b>soberanía del conocimiento, equidad territorial y protección de derechos</b>, operado de forma participativa y multicampus.»',
   items:[
     'Invitar a probar el gemelo 3D y el dashboard.',
     'Contacto DNED–DIVULAB.',
     'Abrir preguntas (reservar ≈ 4 min).'
   ],
   screen:'Portada / contacto.'}
];

const TOTAL_MIN=BLOCKS.reduce((a,b)=>a+b.mins,0);

/* ====== Render ====== */
const main=document.getElementById('main');
const track=document.getElementById('track');
main.innerHTML=BLOCKS.map((b,i)=>{
  const demoClass=b.demo?' demo':'';
  return `<section class="slide" data-i="${i}">
    <div class="num">${b.n} · ${b.mins} min</div>
    <h2>${b.title}</h2>
    <span class="mins">⏱ Duración sugerida: ${b.mins} min</span>
    <div class="key">🎯 ${b.key}</div>
    <ul class="${demoClass.trim()}">${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="screen"><span class="ic">🖥️</span><div><b>En pantalla:</b> ${b.screen}</div></div>
    ${b.say?`<div class="say">🗣️ ${b.say}</div>`:''}
  </section>`;
}).join('');

track.innerHTML=BLOCKS.map((b,i)=>`<div class="seg" data-i="${i}" style="--w:${b.mins}" title="${b.title}"><div class="fill"></div></div>`).join('');
document.getElementById('count').textContent=BLOCKS.length;

/* ====== Navegación ====== */
let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const segs=[...document.querySelectorAll('.track .seg')];
function show(i){
  cur=Math.max(0,Math.min(BLOCKS.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
  segs.forEach((s,k)=>{s.classList.toggle('active',k===cur);s.classList.toggle('done',k<cur);if(k>cur)s.querySelector('.fill').style.width='0';});
  document.getElementById('pos').textContent=cur+1;
  document.getElementById('blkName').textContent=BLOCKS[cur].title;
  segStart=elapsed; // reiniciar cronómetro de bloque al cambiar
  updateSegFill();
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
track.addEventListener('click',e=>{const s=e.target.closest('.seg');if(s)show(+s.dataset.i);});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')show(cur+1);
  else if(e.key==='ArrowLeft')show(cur-1);
  else if(e.key===' '){e.preventDefault();toggleTimer();}
});

/* ====== Cronómetro ====== */
let running=false, elapsed=0, segStart=0, timer=null;
const segTime=document.getElementById('segTime'), totTime=document.getElementById('totTime');
const segBox=document.getElementById('segBox'), totBox=document.getElementById('totBox');
function fmt(s){const m=Math.floor(Math.abs(s)/60),ss=Math.abs(s)%60;return (s<0?'-':'')+m+':'+String(ss).padStart(2,'0');}
function updateSegFill(){
  const budget=BLOCKS[cur].mins*60;
  const used=elapsed-segStart;
  const seg=segs[cur]; if(seg)seg.querySelector('.fill').style.width=Math.min(100,used/budget*100)+'%';
  segTime.textContent=fmt(used);
  segBox.classList.toggle('over',used>budget);
}
function tick(){
  elapsed++;
  const rem=TOTAL_MIN*60-elapsed;
  totTime.textContent=fmt(rem);
  totBox.classList.toggle('over',rem<0);
  updateSegFill();
}
function toggleTimer(){
  running=!running;
  document.getElementById('btnStart').textContent=running?'⏸ Pausar':'▶ Iniciar';
  if(running)timer=setInterval(tick,1000); else clearInterval(timer);
}
document.getElementById('btnStart').onclick=toggleTimer;
document.getElementById('btnReset').onclick=()=>{
  running=false;clearInterval(timer);document.getElementById('btnStart').textContent='▶ Iniciar';
  elapsed=0;segStart=0;totTime.textContent=fmt(TOTAL_MIN*60);totBox.classList.remove('over');
  segs.forEach(s=>{s.classList.remove('done');s.querySelector('.fill').style.width='0';});
  show(0);
};

totTime.textContent=fmt(TOTAL_MIN*60);
show(0);
</script>
</body>
</html>
